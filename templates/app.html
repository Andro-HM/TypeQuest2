<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>TypeQuest</title>
        <style>
            html, body {
                height: 100%;
                margin: 0;
                overflow: hidden;
            }

            #app-frame {
                display: block;
                width: 100%;
                height: 100%;
                border: 0;
            }
        </style>
    </head>
    <body>
        <script>
            const audioSettings =
            {
                "game_volume": {{ game_volume | tojson }},
                "tap_volume": {{ tap_volume | tojson }}
            };
            const audioFiles =
            {
                "ui_tap": {{ url_for('static', filename='audio/ui_tap.wav') | tojson }},
                "correct_key": {{ url_for('static', filename='audio/correct_key.wav') | tojson }},
                "wrong_key": {{ url_for('static', filename='audio/wrong_key.wav') | tojson }}
            };
        </script>
        <script>
            const backgroundMusicUrl = {{ url_for('static', filename='audio/background_music.wav') | tojson }};
            const initialMusicVolume = {{ background_music_volume | tojson }};
        </script>
        <script src="{{ url_for('static', filename='js/background-music.js') }}"></script>
        <script src="{{ url_for('static', filename='js/audio.js') }}"></script>
        <iframe id="app-frame" src="{{ url_for('home') }}" title="TypeQuest pages" allow="autoplay"></iframe>
    </body>
</html>
