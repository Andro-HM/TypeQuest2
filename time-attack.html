<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Time Attack — TypeQuest</title>

        <!-- Fonts used in the Stitch design -->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&amp;family=JetBrains+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">

        <style>
            /* ========================================
               1. PAGE AND BACKGROUND
               ======================================== */

            * {
                box-sizing: border-box;
            }

            body {
                margin: 0;
                background: radial-gradient(circle at 50% 48%, #e8f6fa 0%, #f6f9fb 70%, #f3f7f9 100%);
                color: #0e212b;
                font-family: "Plus Jakarta Sans", sans-serif;
            }

            #page {
                display: flex;
                flex-direction: column;
                min-height: 100vh;
                padding: 44px 70px 58px 70px;
            }

            /* ========================================
               2. TOP CONTROLS AND TIMER
               ======================================== */

            #top-bar {
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 24px;
            }

            .control {
                display: inline-flex;
                align-items: center;
                justify-content: center;
                gap: 16px;
                min-width: 158px;
                min-height: 56px;
                padding: 12px 24px 12px 24px;
                border: 1px solid #b5ddeb;
                border-radius: 15px;
                background-color: rgba(255, 255, 255, 0.35);
                color: #18313d;
                font-family: "JetBrains Mono", monospace;
                font-size: 18px;
                text-decoration: none;
                cursor: pointer;
            }

            .control:hover {
                background-color: #e2f3f8;
            }

            .control:disabled {
                opacity: 0.5;
                cursor: default;
            }

            .control img {
                width: 25px;
                height: 25px;
            }

            #level-info {
                display: flex;
                align-items: center;
                justify-content: center;
                flex-wrap: wrap;
                gap: 32px;
                color: #638098;
                font-family: "JetBrains Mono", monospace;
                font-size: 18px;
                letter-spacing: 0.06em;
            }

            #timer {
                display: flex;
                align-items: center;
                gap: 12px;
                font-size: 20px;
            }

            #timer img {
                width: 26px;
                height: 26px;
            }

            /* ========================================
               3. LEVEL HEADING
               ======================================== */

            #game-content {
                display: flex;
                flex: 1;
                flex-direction: column;
                justify-content: flex-start;
                padding: 58px 0 60px 0;
            }

            #game-heading {
                margin-bottom: 88px;
                text-align: center;
            }

            #status-badge {
                display: inline-flex;
                align-items: center;
                gap: 10px;
                margin-bottom: 18px;
                padding: 6px 18px 6px 18px;
                border: 1px solid #cde7ef;
                border-radius: 9999px;
                background-color: #e6f6fa;
                color: #1c667c;
                font-family: "JetBrains Mono", monospace;
                font-size: 14px;
                font-weight: 600;
                letter-spacing: 0.12em;
            }

            #status-dot {
                width: 10px;
                height: 10px;
                border-radius: 50%;
                background-color: #2dbbc9;
            }

            #challenge-time-heading {
                margin: 0;
                font-size: 68px;
                font-weight: 800;
                letter-spacing: -0.04em;
                line-height: 1.15;
            }

            /* ========================================
               4. SPEED AND TYPING PASSAGE
               ======================================== */

            #typing-layout {
                display: flex;
                align-items: center;
                gap: 38px;
                width: 100%;
            }

            #speed-panel {
                display: flex;
                flex: 0 0 314px;
                min-width: 0;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                height: 202px;
                padding-right: 40px;
                border-right: 1px solid #a9ddec;
            }

            #net-wpm {
                flex-shrink: 0;
                width: 100%;
                height: 152px;
                text-align: center;
                font-variant-numeric: tabular-nums;
                background: linear-gradient(135deg, #1b6b85 0%, #20879f 45%, #2dbbc9 100%);
                background-clip: text;
                -webkit-background-clip: text;
                color: transparent;
                font-size: 138px;
                font-weight: 800;
                letter-spacing: -0.06em;
                line-height: 152px;
            }

            #speed-label {
                margin: 12px 0 0 0;
                color: #638098;
                font-family: "JetBrains Mono", monospace;
                font-size: 30px;
                letter-spacing: 0.16em;
            }

            #typing-area {
                position: relative;
                flex: 1;
                min-width: 0;
                padding: 12px 0 12px 0;
                overflow: hidden;
                color: #6b7fa1;
                font-family: "JetBrains Mono", monospace;
                font-size: 32px;
                line-height: 1.8;
                white-space: pre;
                outline: none;
                cursor: text;
            }

            #typing-area::after {
                position: absolute;
                top: 0;
                right: 0;
                bottom: 0;
                width: 60px;
                background: linear-gradient(to right, transparent, #f6f9fb);
                content: "";
                pointer-events: none;
            }

            .typing-character {
                display: inline-block;
                width: 1ch;
            }

            .hidden-character {
                display: none;
            }

            #typing-area.paused {
                opacity: 0.5;
            }

            .correct {
                color: #159333;
            }

            .incorrect {
                background-color: #ffe1e1;
                color: #c93232;
            }

            .current-character {
                border-left: 3px solid #20adc0;
            }

            /* ========================================
               5. PAUSE AND RESTART
               ======================================== */

            #game-controls {
                text-align: center;
            }

            #control-buttons {
                display: flex;
                justify-content: center;
                gap: 20px;
            }

            #control-buttons .control {
                min-width: 170px;
            }

            #footer-message {
                margin: 20px 0 0 0;
                color: #638098;
                font-family: "JetBrains Mono", monospace;
                font-size: 14px;
                letter-spacing: 0.08em;
                line-height: 1.8;
            }

</style>
    </head>

    <body>
        <div id="page">
            <!-- Mode navigation and the remaining playing time. -->
            <header id="top-bar">
                <a id="modes-link" class="control" href="play.html">
                    <span>&larr;</span>
                    Modes
                </a>

                <div id="level-info">
                    <span id="mode-label">TIME ATTACK / 1 MIN</span>
                    <span id="timer">
                        <img src="icons/time-attack.svg" alt="">
                        <span id="remaining-time">01:00.0</span>
                    </span>
                </div>

                <a class="control" href="index.html">
                    <img src="icons/home.svg" alt="">
                    Home
                </a>
            </header>

            <main id="game-content">
                <div id="game-heading">
                    <div id="status-badge">
                        <span id="status-dot"></span>
                        <span id="game-status">STARTING IN 3</span>
                    </div>
                    <h1 id="challenge-time-heading">1-minute challenge</h1>
                </div>

                <div id="typing-layout">

                    <div id="speed-panel">
                        <span id="net-wpm">0.0</span>
                        <p id="speed-label">NET WPM</p>
                    </div>

                    <div id="typing-area" tabindex="0" spellcheck="false"></div>
                </div>
            </main>

            <footer id="game-controls">
                <div id="control-buttons">
                    <button id="pause-button" class="control" type="button" disabled>
                        <img id="pause-icon" src="icons/pause.svg" alt="">
                        <span id="pause_btn-label">Pause</span>
                    </button>
                    <button id="restart-button" class="control" type="button">
                        <img src="icons/restart.svg" alt="">
                        Restart
                    </button>
                </div>
                <p id="footer-message">ESC &middot; PAUSE</p>
            </footer>
        </div>

        <script src="js/time-attack-data.js"></script>
        <script src="js/time-attack.js"></script>
    </body>
</html>
