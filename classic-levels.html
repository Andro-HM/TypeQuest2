<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Classic Levels — TypeQuest</title>

        <!-- Fonts used in the Stitch design -->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&amp;family=JetBrains+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">

        <style>
            /* ========================================
               1. PAGE AND BACKGROUND
               ======================================== */

            * {
                box-sizing: border-box;
            }

            html, body {
                margin: 0;
                min-height: 100%;
            }

            body {
                background-color: #f3f7f9;
                background-image: radial-gradient(circle at 50% 48%,
                    rgba(220, 240, 247, 0.75) 0%,
                    rgba(235, 245, 249, 0.45) 30%,
                    #f6f9fb 70%,
                    #f3f7f9 100%);
                background-attachment: fixed;
                background-repeat: no-repeat;
                color: #14232c;
                font-family: "Plus Jakarta Sans", sans-serif;
            }

            #page {
                position: relative;
                display: flex;
                flex-direction: column;
                justify-content: space-between;
                min-height: 100vh;
                padding: 28px 48px 28px 48px;
            }

            /* ========================================
               2. TOP NAVIGATION
               ======================================== */

            #top-bar {
                display: flex;
                align-items: center;
                justify-content: space-between;
                width: 100%;
            }

            #brand {
                display: flex;
                align-items: center;
                gap: 14px;
            }

            #brand-logo {
                display: flex;
                align-items: center;
                justify-content: center;
                width: 40px;
                height: 40px;
                border-radius: 12px;
                background-color: #23687d;
                color: white;
                font-size: 14px;
                font-weight: 700;
                letter-spacing: 0.025em;
                box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
            }

            #brand-name {
                color: #0f212b;
                font-size: 20px;
                font-weight: 700;
                letter-spacing: -0.025em;
            }

            #top-nav {
                display: flex;
                align-items: center;
                padding: 4px;
                border: 1px solid rgba(210, 227, 234, 0.6);
                border-radius: 9999px;
                background-color: rgba(228, 238, 242, 0.8);
                backdrop-filter: blur(12px);
                box-shadow: 0 2px 8px rgba(0, 0, 0, 0.02);
            }

            .nav-link {
                padding: 6px 20px 6px 20px;
                border-radius: 9999px;
                color: #4a636f;
                font-size: 14px;
                font-weight: 500;
                text-decoration: none;
                transition: background-color 0.2s, color 0.2s;
            }

            .nav-link:hover {
                background-color: rgba(20, 184, 166, 0.15);
                color: #144857;
            }

            .nav-link-active {
                border: 1px solid rgba(20, 184, 166, 0.2);
                background-color: rgba(20, 184, 166, 0.25);
                color: #144857;
                font-weight: 600;
                box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
            }

            #profile {
                display: flex;
                align-items: center;
                gap: 12px;
            }

            #profile-name {
                color: #18313d;
                font-size: 14px;
                font-weight: 600;
            }

            #profile-icon {
                display: flex;
                align-items: center;
                justify-content: center;
                width: 36px;
                height: 36px;
                border: 1px solid #cbdce3;
                border-radius: 50%;
                background-color: #e2ecf0;
            }

            #profile-icon img {
                width: 20px;
                height: 20px;
            }

            /* ========================================
               3. LEVEL SELECTION HEADING
               ======================================== */

            #levels-content {
                position: relative;
                width: 100%;
                max-width: 1490px;
                margin: 48px auto 16px auto;
            }

            #back-link {
                position: absolute;
                top: 0;
                left: 0;
                color: #638098;
                font-size: 14px;
                text-decoration: none;
            }

            #back-link:hover {
                color: #1d6980;
            }

            #levels-heading {
                margin-bottom: 14px;
                text-align: center;
            }

            #tagline {
                display: inline-flex;
                align-items: center;
                gap: 8px;
                margin-bottom: 10px;
                padding: 6px 16px 6px 16px;
                border: 1px solid rgba(205, 226, 233, 0.7);
                border-radius: 9999px;
                background-color: rgba(226, 239, 243, 0.7);
                color: #1c667c;
                font-size: 12px;
                font-weight: 600;
                letter-spacing: 0.16em;
                text-transform: uppercase;
            }

            #tagline-dot {
                width: 10px;
                height: 10px;
                border-radius: 50%;
                background-color: #52bfcf;
            }

            #levels-title {
                margin: 0 0 10px 0;
                color: #0e212b;
                font-size: 68px;
                font-weight: 800;
                letter-spacing: -0.04em;
                line-height: 1.1;
            }

            #title-level {
                background: linear-gradient(135deg, #1b6b85 0%, #20879f 45%, #2dbbc9 100%);
                background-clip: text;
                -webkit-background-clip: text;
                color: transparent;
            }

            #levels-description {
                margin: 0 0 8px 0;
                color: #638098;
                font-size: 20px;
                line-height: 1.5;
            }

            /* ========================================
               4. TIER BUTTONS
               ======================================== */

            #tiers {
                display: grid;
                grid-template-columns: repeat(5, 1fr);
                gap: 12px;
                margin-bottom: 26px;
            }

            .tier-button {
                display: flex;
                align-items: center;
                justify-content: center;
                gap: 16px;
                min-height: 70px;
                padding: 10px;
                border: 1px solid #d5e7ee;
                border-radius: 12px;
                background-color: rgba(255, 255, 255, 0.8);
                color: #638098;
                font-family: inherit;
                cursor: pointer;
            }

            .tier-button:disabled {
                cursor: not-allowed;
            }

            .tier-button:hover {
                background-color: #e2f5f8;
            }

            .tier-button:disabled:hover {
                background-color: rgba(255, 255, 255, 0.8);
            }

            .tier-selected {
                border-color: #28a8be;
                background-color: #e2f5f8;
                color: #0e212b;
            }

            .tier-lock {
                width: 22px;
                height: 22px;
            }

            .tier-name {
                display: block;
                margin-bottom: 4px;
                font-size: 20px;
                font-weight: 700;
            }

            .tier-range {
                display: block;
                color: #638098;
                font-family: "JetBrains Mono", monospace;
                font-size: 13px;
            }

            /* ========================================
               5. TIER HEADING
               ======================================== */

            #tier-summary {
                margin-bottom: 18px;
            }

            #tier-title {
                margin: 0;
                color: #0e212b;
                font-size: 30px;
                font-weight: 800;
                letter-spacing: -0.035em;
            }

            /* ========================================
               6. LEVEL CARDS
               ======================================== */

            #level-grid {
                display: grid;
                grid-template-columns: repeat(5, 1fr);
                gap: 12px;
            }

            .level-card {
                display: flex;
                flex-direction: column;
                min-width: 0;
                min-height: 170px;
                padding: 16px 18px 14px 18px;
                border: 1px solid #d5e7ee;
                border-radius: 12px;
                background-color: rgba(255, 255, 255, 0.8);
                box-shadow: 0 6px 20px rgba(26, 105, 128, 0.03);
            }

            .level-number {
                margin: 0 0 10px 0;
                color: #638098;
                font-family: "JetBrains Mono", monospace;
                font-size: 12px;
                line-height: 1.5;
            }

            .level-title {
                margin: 0 0 8px 0;
                color: #0e212b;
                font-size: 20px;
                font-weight: 700;
                letter-spacing: -0.025em;
                line-height: 1.35;
            }

            .level-status {
                margin: 0 0 12px 0;
                color: #638098;
                font-size: 13px;
                line-height: 1.5;
            }

            .level-button {
                display: block;
                text-align: center;
                text-decoration: none;
                width: 100%;
                margin-top: auto;
                padding: 10px 8px 10px 8px;
                border: none;
                border-radius: 8px;
                background-color: #1d6980;
                color: white;
                font-family: inherit;
                font-size: 16px;
                font-weight: 700;
                line-height: 1.4;
                cursor: pointer;
            }

            .level-button:hover {
                opacity: 0.9;
            }

            /* ========================================
               7. BOTTOM STATUS BAR
               ======================================== */

            #bottom-bar {
                display: flex;
                align-items: center;
                justify-content: space-between;
                width: 100%;
                color: #738e9b;
                font-family: "JetBrains Mono", monospace;
                font-size: 12px;
                letter-spacing: 0.025em;
            }

            #audio-status {
                display: flex;
                align-items: center;
                gap: 10px;
            }

            #audio-dot {
                width: 8px;
                height: 8px;
                border-radius: 50%;
                background-color: #1b889e;
            }

</style>
    </head>

    <body>
        <div id="page">
            <!-- ========================================
                 1. TOP NAVIGATION
                 ======================================== -->
            <header id="top-bar">
                <div id="brand">
                    <div id="brand-logo">TQ</div>
                    <span id="brand-name">TypeQuest</span>
                </div>

                <nav id="top-nav">
                    <!-- Progress, Profiles, and Settings are placeholders for now. -->
                    <a href="index.html" class="nav-link">Home</a>
                    <a href="play.html" class="nav-link nav-link-active">Play</a>
                    <a href="#progress" class="nav-link">Progress</a>
                    <a href="#profiles" class="nav-link">Profiles</a>
                    <a href="#settings" class="nav-link">Settings</a>
                </nav>

                <div id="profile">
                    <span id="profile-name">TactileTypist</span>
                    <div id="profile-icon">
                        <img src="icons/profile.svg" alt="">
                    </div>
                </div>
            </header>

            <!-- ========================================
                 2. CLASSIC LEVEL SELECTION
                 ======================================== -->
            <main id="levels-content">
                <a id="back-link" href="play.html">&larr; Game modes</a>

                <div id="levels-heading">
                    <div id="tagline">
                        <span id="tagline-dot"></span>
                        <span>Classic mode</span>
                    </div>

                    <h1 id="levels-title">
                        Choose your <span id="title-level">level</span>
                    </h1>

                    <p id="levels-description">
                        Build accuracy. Earn stars. Unlock your next challenge.
                    </p>
                </div>

                <!-- JavaScript reads the tiers and levels from classic-data.js. -->
                <div id="tiers"></div>

                <div id="tier-summary">
                    <h2 id="tier-title">Tier 1</h2>
                </div>

                <div id="level-grid"></div>
            </main>

            <!-- ========================================
                 3. BOTTOM STATUS BAR
                 ======================================== -->
            <footer id="bottom-bar">
                <div id="audio-status">
                    <span id="audio-dot"></span>
                    <span>AUDIO [STEREO 48k]</span>
                </div>
                <span>© 2025 TYPEQUEST STUDIO</span>
            </footer>
        </div>

        <script src="js/classic-data.js"></script>
        <script src="js/classic-levels.js"></script>
    </body>
</html>
